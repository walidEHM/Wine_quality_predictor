<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction de la qualité du vin 🍷</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --wine:       #7b1426;
            --wine-mid:   #9e2035;
            --wine-light: #f5e8eb;
            --wine-pale:  #fdf4f5;
            --gold:       #a07830;
            --gold-light: #f7eed8;
            --cream:      #faf7f2;
            --parchment:  #f2ece2;
            --border:     #e4d9cc;
            --border-2:   #cfc0ae;
            --text:       #2a1f1a;
            --text-muted: #7a6a5e;
            --text-dim:   #b0a090;
            --radius:     6px;
            --radius-lg:  14px;
        }

        body {
            background-color: var(--cream);
            background-image:
                radial-gradient(ellipse 70% 50% at 50% -5%, rgba(123,20,38,0.07) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(160,120,48,0.06) 0%, transparent 60%);
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            padding: 3rem 1rem 5rem;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeDown 0.6s ease both;
        }
        .header-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--wine);
            background: var(--wine-light);
            border: 1px solid rgba(123,20,38,0.15);
            border-radius: 100px;
            padding: 0.35rem 0.9rem;
            margin-bottom: 1.1rem;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.9rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1.1;
        }
        .header h1 em {
            font-style: italic;
            color: var(--wine);
            font-weight: 400;
        }
        .header p {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* ── Divider ── */
        .ornament {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 2rem 0;
            color: var(--text-dim);
        }
        .ornament::before, .ornament::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border-2));
        }
        .ornament::after { background: linear-gradient(to left, transparent, var(--border-2)); }
        .ornament span { font-size: 1rem; }

        /* ── Card ── */
        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.25rem;
            box-shadow: 0 2px 8px rgba(42,31,26,0.06), 0 0 0 1px rgba(42,31,26,0.02);
            animation: fadeUp 0.55s ease 0.1s both;
        }

        /* ── Section label ── */
        .section-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 1.25rem;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Form Grid ── */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
            gap: 1rem 1.25rem;
        }

        .field { display: flex; flex-direction: column; gap: 0.4rem; }

        .field label {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .field input {
            background: var(--parchment);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.6rem 0.85rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.88rem;
            color: var(--text);
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            -moz-appearance: textfield;
        }
        .field input::-webkit-outer-spin-button,
        .field input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .field input:hover {
            border-color: var(--border-2);
            background: #fff;
        }
        .field input:focus {
            border-color: var(--wine-mid);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(123,20,38,0.08);
        }

        /* ── Button ── */
        .btn-container { text-align: center; margin-top: 2rem; }

        .btn-predict {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--wine);
            border: none;
            border-radius: 100px;
            padding: 0.85rem 2.4rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 16px rgba(123,20,38,0.25);
            position: relative;
        }
        .btn-predict:hover {
            background: var(--wine-mid);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(123,20,38,0.3);
        }
        .btn-predict:active { transform: translateY(0); }
        .btn-predict svg { width: 15px; height: 15px; flex-shrink: 0; }
        .btn-predict.loading .btn-text { opacity: 0; }
        .btn-predict.loading::after {
            content: '';
            position: absolute;
            width: 17px; height: 17px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* ── Result ── */
        .result-box {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            animation: fadeUp 0.45s ease both;
        }
        .result-box.visible { display: block; }

        /* Score card */
        .score-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--wine-pale);
            border: 1px solid rgba(123,20,38,0.1);
            border-left: 3px solid var(--wine);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
            margin-bottom: 1.75rem;
        }
        .score-left {}
        .score-micro {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--wine);
            margin-bottom: 0.25rem;
        }
        .score-class {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--wine);
        }
        .quality-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1rem;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            border: 1px solid;
        }
        .badge-excellent { background: #eaf6dc; border-color: #9dcc60; color: #3b6d11; }
        .badge-good      { background: var(--gold-light); border-color: #cca050; color: var(--gold); }
        .badge-average   { background: #f0ede8; border-color: var(--border-2); color: var(--text-muted); }
        .badge-poor      { background: #fdeaea; border-color: #e08080; color: #a32d2d; }

        /* ── Proba bars ── */
        .prob-title {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }
        .prob-item { margin-bottom: 0.85rem; }
        .prob-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.3rem;
        }
        .prob-cls {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .prob-cls.active { color: var(--wine); font-weight: 500; }
        .prob-pct {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .prob-pct.active { color: var(--wine); }
        .prob-track {
            height: 7px;
            background: var(--parchment);
            border-radius: 100px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .prob-fill {
            height: 100%;
            border-radius: 100px;
            background: var(--border-2);
            width: 0;
            transition: width 0.85s cubic-bezier(0.22,1,0.36,1);
        }
        .prob-fill.active {
            background: linear-gradient(90deg, var(--wine), var(--wine-mid));
        }

        /* ── Animations ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 520px) {
            body { padding: 1.5rem 0.75rem 4rem; }
            .card { padding: 1.25rem; }
            .form-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">

        <header class="header">
            <div><span class="header-eyebrow">◈ Analyse sensorielle</span></div>
            <h1>Qualité du <em>Vin</em></h1>
            <p>Renseignez les paramètres physico-chimiques pour obtenir une prédiction</p>
        </header>

        <div class="ornament"><span>✦</span></div>

        <div class="card">

            <p class="section-label">Paramètres du vin</p>

            <form id="wine-form">
                <div class="form-grid">
                    {% for feat in feature_names %}
                    <div class="field">
                        <label for="{{ feat }}">{{ feat.replace('_', ' ') }}</label>
                        <input type="number" step="any" id="{{ feat }}" name="{{ feat }}"
                            value="{% if feat=='fixed acidity' %}7.4{% elif feat=='volatile acidity' %}0.7{% elif feat=='citric acid' %}0.0{% elif feat=='residual sugar' %}1.9{% elif feat=='chlorides' %}0.076{% elif feat=='free sulfur dioxide' %}11{% elif feat=='total sulfur dioxide' %}34{% elif feat=='density' %}0.9978{% elif feat=='pH' %}3.51{% elif feat=='sulphates' %}0.56{% elif feat=='alcohol' %}9.4{% endif %}">
                    </div>
                    {% endfor %}
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-predict" id="btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                        </svg>
                        <span class="btn-text">Prédire la qualité</span>
                    </button>
                </div>
            </form>

            <!-- Résultat -->
            <div id="result-container" class="result-box">

                <div class="score-card">
                    <div class="score-left">
                        <p class="score-micro">Classe prédite</p>
                        <p class="score-class" id="result-class">—</p>
                    </div>
                    <span id="result-badge" class="quality-badge badge-good">—</span>
                </div>

                <p class="prob-title">Distribution des probabilités</p>
                <div id="probabilities-container"></div>
            </div>

        </div>
    </div>

    <script>
        const btn = document.getElementById('btn');

        document.getElementById('wine-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            btn.classList.add('loading');

            try {
                const res  = await fetch('/predict', { method: 'POST', body: new FormData(this) });
                const data = await res.json();

                if (data.error) { alert('Erreur : ' + data.error); return; }

                const pred  = Number(data.prediction);
                const badge = document.getElementById('result-badge');
                badge.className = 'quality-badge';
                if      (pred >= 8) { badge.classList.add('badge-excellent'); badge.textContent = '★ Excellent'; }
                else if (pred >= 7) { badge.classList.add('badge-good');      badge.textContent = '✦ Bon'; }
                else if (pred >= 5) { badge.classList.add('badge-average');   badge.textContent = '◆ Moyen'; }
                else                { badge.classList.add('badge-poor');      badge.textContent = '◇ Faible'; }

                document.getElementById('result-class').textContent = data.label || ('Classe ' + pred);

                const container = document.getElementById('probabilities-container');
                container.innerHTML = '';
                const entries = Object.entries(data.probabilities).sort((a,b) => +a[0] - +b[0]);

                for (const [cls, prob] of entries) {
                    const pct      = (prob * 100).toFixed(1);
                    const isActive = cls == data.prediction;
                    container.innerHTML += `
                        <div class="prob-item">
                            <div class="prob-row">
                                <span class="prob-cls ${isActive ? 'active' : ''}">Classe ${cls}</span>
                                <span class="prob-pct ${isActive ? 'active' : ''}">${pct}%</span>
                            </div>
                            <div class="prob-track">
                                <div class="prob-fill ${isActive ? 'active' : ''}" data-w="${pct}"></div>
                            </div>
                        </div>`;
                }

                const box = document.getElementById('result-container');
                box.classList.add('visible');
                requestAnimationFrame(() => {
                    box.querySelectorAll('.prob-fill').forEach(el => { el.style.width = el.dataset.w + '%'; });
                });

            } catch (err) {
                alert('Erreur réseau : ' + err.message);
            } finally {
                btn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
